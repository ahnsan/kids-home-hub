<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#01579b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0277bd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- House icon -->
  <g transform="translate(256, 256)">
    <!-- Roof -->
    <path d="M -100,-60 L 0,-130 L 100,-60 L 85,-60 L 85,-40 L 65,-40 L 65,-60 Z" fill="url(#houseGrad)" stroke="#0277bd" stroke-width="4"/>

    <!-- House body -->
    <rect x="-90" y="-60" width="180" height="160" fill="url(#houseGrad)" stroke="#0277bd" stroke-width="4" rx="4"/>

    <!-- Door -->
    <rect x="-25" y="20" width="50" height="80" fill="#01579b" rx="4"/>
    <circle cx="10" cy="65" r="4" fill="#ffd700"/>

    <!-- Windows -->
    <rect x="-70" y="-30" width="35" height="35" fill="#81d4fa" stroke="#0277bd" stroke-width="2" rx="2"/>
    <rect x="35" y="-30" width="35" height="35" fill="#81d4fa" stroke="#0277bd" stroke-width="2" rx="2"/>
    <line x1="-52.5" y1="-30" x2="-52.5" y2="5" stroke="#0277bd" stroke-width="2"/>
    <line x1="-70" y1="-12.5" x2="-35" y2="-12.5" stroke="#0277bd" stroke-width="2"/>
    <line x1="52.5" y1="-30" x2="52.5" y2="5" stroke="#0277bd" stroke-width="2"/>
    <line x1="35" y1="-12.5" x2="70" y2="-12.5" stroke="#0277bd" stroke-width="2"/>

    <!-- Star (reward symbol) -->
    <g transform="translate(80, -95) scale(0.5)">
      <path d="M 0,-20 L 6,-6 L 21,-6 L 9,3 L 15,17 L 0,8 L -15,17 L -9,3 L -21,-6 L -6,-6 Z" fill="#ffd700" stroke="#ff6f00" stroke-width="2"/>
    </g>
  </g>
</svg>
