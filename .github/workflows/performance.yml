name: Performance Monitoring

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  bundle-size:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Analyze bundle size
        run: npm run bundle:analyze

      - name: Check bundle size budget
        run: npm run bundle:check
        continue-on-error: false

      - name: Bundle size report
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: install

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v5
        with:
          name: bundle-analysis
          path: |
            bundle-stats.json
            bundle-report.html

  lighthouse-ci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-results
          path: .lighthouseci/

      - name: Check Lighthouse scores
        run: |
          # Extract scores from Lighthouse report
          PERFORMANCE=$(jq -r '.categories.performance.score * 100' .lighthouseci/lhr-*.json | head -1)
          ACCESSIBILITY=$(jq -r '.categories.accessibility.score * 100' .lighthouseci/lhr-*.json | head -1)
          BEST_PRACTICES=$(jq -r '.categories["best-practices"].score * 100' .lighthouseci/lhr-*.json | head -1)
          SEO=$(jq -r '.categories.seo.score * 100' .lighthouseci/lhr-*.json | head -1)
          PWA=$(jq -r '.categories.pwa.score * 100' .lighthouseci/lhr-*.json | head -1)

          echo "Performance: $PERFORMANCE"
          echo "Accessibility: $ACCESSIBILITY"
          echo "Best Practices: $BEST_PRACTICES"
          echo "SEO: $SEO"
          echo "PWA: $PWA"

          # Fail if any score is below 90
          if (( $(echo "$PERFORMANCE < 90" | bc -l) )) || \
             (( $(echo "$ACCESSIBILITY < 90" | bc -l) )) || \
             (( $(echo "$BEST_PRACTICES < 90" | bc -l) )) || \
             (( $(echo "$SEO < 90" | bc -l) )) || \
             (( $(echo "$PWA < 90" | bc -l) )); then
            echo "::error::Lighthouse scores below threshold (90)"
            exit 1
          fi

  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start local server
        run: |
          npm run preview &
          sleep 5

      - name: Install k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.47.0/k6-v0.47.0-linux-amd64.tar.gz -L | tar xvz --strip-components 1

      - name: Run load tests
        run: ./k6 run scripts/ci/load-test.js

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: load-test-results
          path: load-test-results.json

  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run memory profiling
        run: npm run profile:memory

      - name: Check memory usage
        run: |
          HEAP_SIZE=$(jq -r '.heapUsed' memory-profile.json)
          MAX_HEAP=100000000  # 100MB

          echo "Heap size: $HEAP_SIZE bytes"

          if [ "$HEAP_SIZE" -gt "$MAX_HEAP" ]; then
            echo "::error::Memory usage exceeds threshold"
            exit 1
          fi

      - name: Upload memory profile
        uses: actions/upload-artifact@v5
        with:
          name: memory-profile
          path: memory-profile.json

  build-time-tracking:
    name: Build Time Tracking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Measure build time
        run: |
          START_TIME=$(date +%s)
          npm run build
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))

          echo "Build time: ${BUILD_TIME}s"
          echo "BUILD_TIME=${BUILD_TIME}" >> $GITHUB_ENV

          # Fail if build takes longer than 120 seconds
          if [ "$BUILD_TIME" -gt 120 ]; then
            echo "::error::Build time exceeds threshold (120s)"
            exit 1
          fi

      - name: Create build time badge
        run: |
          echo "Build time: ${{ env.BUILD_TIME }}s" >> $GITHUB_STEP_SUMMARY

  performance-summary:
    name: Performance Summary
    needs: [bundle-size, lighthouse-ci, load-testing, memory-profiling, build-time-tracking]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3

      - name: Create performance summary
        run: |
          echo "## Performance Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle Size | ${{ needs.bundle-size.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse CI | ${{ needs.lighthouse-ci.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Load Testing | ${{ needs.load-testing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory Profiling | ${{ needs.memory-profiling.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Time | ${{ needs.build-time-tracking.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Verify performance checks
        if: |
          needs.bundle-size.result != 'success' ||
          needs.lighthouse-ci.result != 'success' ||
          needs.build-time-tracking.result != 'success'
        run: |
          echo "::error::Critical performance checks failed"
          exit 1

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = '${{ needs.bundle-size.result }}' === 'success' &&
                          '${{ needs.lighthouse-ci.result }}' === 'success' &&
                          '${{ needs.build-time-tracking.result }}' === 'success';

            const emoji = status ? ':rocket:' : ':warning:';
            const message = `${emoji} Performance Analysis ${status ? 'Passed' : 'Failed'}

            | Check | Status |
            |-------|--------|
            | Bundle Size | ${{ needs.bundle-size.result }} |
            | Lighthouse CI | ${{ needs.lighthouse-ci.result }} |
            | Load Testing | ${{ needs.load-testing.result }} |
            | Memory Profiling | ${{ needs.memory-profiling.result }} |
            | Build Time | ${{ needs.build-time-tracking.result }} |
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
